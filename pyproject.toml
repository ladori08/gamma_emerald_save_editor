[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-emerald-save-editor"
version = "0.16.1"
description = "Safe save inspector/editor for Pokemon Gamma Emerald GES1/GVAS saves"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.0"]

[project.scripts]
gamma-save = "gamma_editor.cli:main"
gamma-save-gui = "gamma_editor.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
